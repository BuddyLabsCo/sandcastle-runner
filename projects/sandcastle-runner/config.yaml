# Copy this Project and replace repository, checkout, runnerAccount, and targetBranch.

# GitHub repository in owner/name form.
repository: BuddyLabsCo/sandcastle-runner
# Absolute path to the repository checkout.
checkout: /home/xiakeng/Desktop/workspace/sandcastle-runner-checkout/
# Unique positive issue numbers; limits Parent Runs or drives value-less --issue Runs.
issueList: []
# Required positive safe integer; caps newly discovered Parent and Standalone Batches.
maxBatchSize: 2
# Branch to integrate into; omit to use the repository default branch.
targetBranch: main
# Additional automatic attempts after the initial attempt (non-negative integers).
# See docs/adr/0001-configurable-retry-policy.md.
operationRetry: 4
agentRetry: 2
# Positive delays in seconds; the final delay repeats when the retry budget is longer.
operationRetryDelay:
  - 10
  - 20
  - 40
  - 80
agentRetryDelay:
  - 300
  - 300
# runner closes tickets after merge; code_host waits for GitHub-linked closure.
ticketClosure: runner
# Title, body, and label for Documentation Maintenance tickets.
maintenanceTicket:
  title: Maintain project documentation
  body: n/a
  label: doc-maintain
workflow:
  # Defaults to true; false bypasses the entire review/fix loop.
  review: true
  # Optional positive integer, with no default cap. Omit to repeat until a clean review.
  # Initial review is round 1; retries and Operator Pause continuations do not add rounds.
  # 1 permits review + fix; 2 permits review + fix + review + fix.
  # The final findings still receive a fix, then delivery proceeds without another review.
  maxReviewRounds: 2
  # Exact case-sensitive label on a completed issue triggers one maintenance per Batch.
  # Omitted, empty, or whitespace-only values disable automatic maintenance.
  docMaintainTriggerLabel: ""
tracker:
  # GitHub tracker settings. tokenEnv names an environment variable; reservationLabel marks Runner-owned Delivery Tickets.
  type: github
  tokenEnv: GH_TOKEN
  runnerAccount: xiakeng
  reservationLabel: sandcastle:reserved
codeHost:
  # GitHub Pull Request settings. adminMerge allows or forbids administrative squash merge requests.
  type: github
  tokenEnv: GH_TOKEN
  adminMerge: true
agents:
  # Each purpose independently selects agent (codex/claude-code/pi/codebuddy),
  # model, and optional native options.
  # Options are forwarded unchanged; switching agents does not translate them.
  # Review requires a profile when enabled. Documentation requires one for a nonempty
  # maintenance trigger or --document, which uses the same documentation profile.
  # If native session lookup differs from actual storage, set options.sessionStorage:
  # hostSessionsDir for Codex/Pi, or hostProjectsDir for Claude Code.
  # CodeBuddy defaults to bypassPermissions and CODEBUDDY_IS_SANDBOX=1.
  # Optional options.env.CODEBUDDY_CONFIG_DIR (absolute) selects CLI storage and lookup.
  # Authenticate the CLI before running; see README CodeBuddy setup.
  implement:
    # Initial Delivery Ticket implementation.
    agent: codex
    model: group/deepseek-v4.1-flash
    options:
      effort: max
  review:
    # Independent Standards and Spec review session, reused across review rounds.
    agent: codex
    model: codex/gpt-6.1-sol
    options:
      effort: high
  ciRepair:
    # Repair of failed required CI checks.
    agent: codex
    model: group/deepseek-v4.1-flash
    options:
      effort: max
  conflictRepair:
    # Repair of an explicit merge conflict.
    agent: codex
    model: group/deepseek-v4.1-flash
    options:
      effort: max
  documentation:
    # Documentation Maintenance.
    agent: codex
    model: group/deepseek-v4.1-flash
    options:
      effort: max
timeouts:
  # Positive minute thresholds. Agent thresholds pause while the invocation stays alive.
  # Overall runtime per invocation; required, with no default (120 is this Project's choice).
  agentMinutes: 120
  # Silence on stdout/stderr, including partial lines; optional, defaults to 10.
  # Enter grants a fresh idle window without resetting overall runtime.
  agentIdleMinutes: 10
  # Readiness and merge-queue limits retain their existing behavior.
  requiredChecksMinutes: 60
  mergeQueueMinutes: 60
