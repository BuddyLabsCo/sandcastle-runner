name: CI

on:
  pull_request:
  # Publication re-runs these checks on the exact merged release commit, so this
  # workflow is the single definition of the required checks.
  workflow_call:
    inputs:
      ref:
        description: Commit to check instead of the event revision
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.18.0
          - 24.0.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
